<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Golden Hawks 20-Year Legacy Photo Customizer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2f2;font-family:Arial,sans-serif;color:#222;text-align:center;padding:18px 10px 30px}h1{font-size:22px;margin:4px 0 6px}.sub{font-size:14px;margin:0 auto 16px;color:#555}.wrap{max-width:760px;margin:auto}.plaque{position:relative;width:100%;max-width:760px;margin:0 auto;overflow:hidden;line-height:0;background:#ddd}.plaque img.base{display:block;width:100%;height:auto}.photo-slot{position:absolute;overflow:hidden;cursor:pointer;background:rgba(255,255,255,.15)}.photo-slot img{width:100%;height:100%;object-fit:cover;display:block}.slot-left{left:14.1%;top:39.0%;width:28.8%;height:31.2%}.slot-right{left:57.0%;top:39.0%;width:28.8%;height:31.2%}input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);font-weight:700;font-size:clamp(11px,2.2vw,16px);color:#333;line-height:1.2;padding:5px}.has-photo .hint{display:none}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer;background:#222;color:#fff}button.secondary{background:#777}.note{font-size:12px;color:#666;margin:10px auto 0;max-width:620px;line-height:1.4}@media(max-width:480px){body{padding-top:10px}h1{font-size:19px}.sub{font-size:13px}.controls button{width:100%;max-width:320px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Golden Hawks 20-Year Legacy</h1>
<p class="sub">Tap either photo square to add your own picture.</p>
<div class="plaque" id="plaque">
<img class="base" id="base" alt="Golden Hawks 20-Year Legacy plaque">
<label class="photo-slot slot-left" id="leftSlot" aria-label="Choose left photo"><input id="leftInput" type="file" accept="image/*"><img id="leftPhoto" alt="Left custom photo"><span class="hint">TAP TO ADD PHOTO</span></label>
<label class="photo-slot slot-right" id="rightSlot" aria-label="Choose right photo"><input id="rightInput" type="file" accept="image/*"><img id="rightPhoto" alt="Right custom photo"><span class="hint">TAP TO ADD PHOTO</span></label>
</div>
<div class="controls"><button id="save">Save Finished Plaque</button><button class="secondary" id="clear">Clear Photos</button></div>
<p class="note">Your photos stay on your device while you edit. The finished plaque is saved as a PNG.</p>
</div>
<script>
const PLAQUE_DATA='data:image/png;base64,REPLACE_ME';
const base=document.getElementById('base');
base.src=PLAQUE_DATA;
const leftInput=document.getElementById('leftInput'),rightInput=document.getElementById('rightInput');
const leftPhoto=document.getElementById('leftPhoto'),rightPhoto=document.getElementById('rightPhoto');
const leftSlot=document.getElementById('leftSlot'),rightSlot=document.getElementById('rightSlot');
function setup(input,img,slot){input.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{img.src=r.result;slot.classList.add('has-photo')};r.readAsDataURL(f)})}
setup(leftInput,leftPhoto,leftSlot);setup(rightInput,rightPhoto,rightSlot);
document.getElementById('clear').onclick=()=>{leftInput.value='';rightInput.value='';leftPhoto.removeAttribute('src');rightPhoto.removeAttribute('src');leftSlot.classList.remove('has-photo');rightSlot.classList.remove('has-photo')};
document.getElementById('save').onclick=()=>{const b=document.getElementById('base');if(!b.complete){alert('Please wait for the plaque to load.');return}const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=b.naturalWidth;c.height=b.naturalHeight;ctx.drawImage(b,0,0);const draw=(img,slot)=>{if(!img.src)return;const x=slot.offsetLeft*(c.width/b.clientWidth),y=slot.offsetTop*(c.height/b.clientWidth),w=slot.offsetWidth*(c.width/b.clientWidth),h=slot.offsetHeight*(c.height/b.clientWidth);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(img,x,y,w,h);ctx.restore()};draw(leftPhoto,leftSlot);draw(rightPhoto,rightSlot);const a=document.createElement('a');a.download='golden-hawks-20-year-legacy.png';a.href=c.toDataURL('image/png');a.click()};
</script>
</body>
</html>
