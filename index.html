<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golden Hawks 20-Year Legacy — Photo Editor</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial,sans-serif; background:#111; color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; max-width:1100px; padding:18px 16px 8px; text-align:center; }
  h1 { margin:0 0 6px; font-size:clamp(20px,4vw,30px); }
  .sub { margin:0; opacity:.9; font-size:14px; }
  .wrap { width:min(96vw,900px); padding:10px 0 28px; }
  .plaque { position:relative; width:100%; line-height:0; overflow:hidden; border-radius:8px; }
  .base { display:block; width:100%; height:auto; }
  .photo-slot { position:absolute; overflow:hidden; cursor:pointer; background:rgba(255,255,255,.12); }
  .photo-slot img { width:100%; height:100%; object-fit:cover; display:block; }
  .slot-left { left:14.58%; top:28.22%; width:19.40%; height:50.68%; }
  .slot-right { left:61.91%; top:23.14%; width:25.85%; height:53.91%; }
  .photo-slot input { position:absolute; width:1px; height:1px; opacity:0; }
  .hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; background:rgba(255,255,255,.58); color:#222; font-weight:700; font-size:clamp(10px,2.2vw,16px); line-height:1.2; padding:8px; }
  .has-photo .hint { display:none; }
  .controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  button { border:0; border-radius:10px; padding:13px 18px; font-size:15px; font-weight:700; cursor:pointer; }
  #save { background:#fff; color:#111; }
  #clear { background:#666; color:#fff; }
  .note { margin:12px auto 0; max-width:700px; font-size:12px; line-height:1.45; color:#ccc; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Golden Hawks 20-Year Legacy</h1>
  <p class="sub">Tap either photo square to add your own picture.</p>
</header>
<div class="wrap">
  <div class="plaque" id="plaque">
    <img class="base" crossorigin="anonymous" src="https://cdn.jsdelivr.net/gh/cckitchens6-eng/golden-hawks-photo-customizer-@main/golden-hawks-20-year-legacy.jpg?v=4" alt="Golden Hawks 20-Year Legacy plaque">
    <label class="photo-slot slot-left" id="leftSlot" aria-label="Choose left photo"><input id="leftInput" type="file" accept="image/*"><img id="leftPhoto" alt="Left custom photo"><span class="hint">TAP TO ADD PHOTO</span></label>
    <label class="photo-slot slot-right" id="rightSlot" aria-label="Choose right photo"><input id="rightInput" type="file" accept="image/*"><img id="rightPhoto" alt="Right custom photo"><span class="hint">TAP TO ADD PHOTO</span></label>
  </div>
  <div class="controls"><button id="save">Save / Download Finished Plaque</button><button id="clear">Clear Photos</button></div>
  <p class="note">Your photos stay on your device while you edit. On iPhone or Samsung, the Save button opens the phone share/save options. If it opens the picture by itself, press and hold the picture to save it to Photos/Gallery.</p>
</div>
<script>
const state = { left:null, right:null };
function loadPhoto(input, key, slotId, imgId) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    state[key] = e.target.result;
    document.getElementById(imgId).src = e.target.result;
    document.getElementById(slotId).classList.add('has-photo');
  };
  reader.readAsDataURL(file);
}
const leftInputEl = document.getElementById('leftInput');
const rightInputEl = document.getElementById('rightInput');
leftInputEl.addEventListener('change', () => loadPhoto(leftInputEl,'left','leftSlot','leftPhoto'));
rightInputEl.addEventListener('change', () => loadPhoto(rightInputEl,'right','rightSlot','rightPhoto'));
function clearPhotos() {
  state.left = state.right = null;
  ['leftSlot','rightSlot'].forEach(id => document.getElementById(id).classList.remove('has-photo'));
  document.getElementById('leftPhoto').src = document.getElementById('rightPhoto').src = '';
  leftInputEl.value = rightInputEl.value = '';
}
function drawCover(ctx, data, slot) {
  return new Promise(resolve => {
    if (!data) { resolve(); return; }
    const im = new Image();
    im.onload = () => {
      const scale = Math.max(slot.w/im.width, slot.h/im.height);
      const sw = slot.w/scale, sh = slot.h/scale;
      ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,slot.x,slot.y,slot.w,slot.h);
      resolve();
    };
    im.src = data;
  });
}
async function downloadPlaque() {
  const base = document.querySelector('.base');
  if (!base.complete || !base.naturalWidth) { alert('Please wait for the plaque to load, then try again.'); return; }
  const canvas = document.createElement('canvas');
  canvas.width = 1536;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(base,0,0,canvas.width,canvas.height);
  const left = {x:224,y:289,w:298,h:519};
  const right = {x:951,y:237,w:397,h:552};
  await drawCover(ctx,state.left,left);
  await drawCover(ctx,state.right,right);
  canvas.toBlob(saveBlob,'image/png');
}
async function saveBlob(blob) {
  if (!blob) { alert('Sorry, the plaque could not be created. Please try again.'); return; }
  const filename='golden-hawks-20-year-legacy.png';
  try {
    if (navigator.share && window.File) {
      const file = new File([blob],filename,{type:'image/png'});
      if (!navigator.canShare || navigator.canShare({files:[file]})) {
        await navigator.share({files:[file],title:'Golden Hawks 20-Year Legacy'});
        return;
      }
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return;
  }
  const url = URL.createObjectURL(blob);
  const w = window.open(url,'_blank');
  if (!w) {
    const a=document.createElement('a'); a.href=url; a.download=filename; a.click();
  }
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
document.getElementById('save').addEventListener('click',downloadPlaque);
document.getElementById('clear').addEventListener('click',clearPhotos);
</script>
</body>
</html>
