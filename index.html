<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Golden Hawks 20-Year Legacy</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center}h1{font-size:clamp(22px,6vw,34px);margin:18px 10px 8px}.sub{margin:0 10px 14px;color:#ddd}.wrap{width:min(96vw,900px);margin:auto}.plaque{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden}.base{position:absolute;inset:0;width:100%;height:100%;display:block}.slot{position:absolute;overflow:hidden;cursor:pointer;background:#eee;border:clamp(4px,0.7vw,8px) solid #c99518;box-shadow:0 0 0 2px #6d4a08 inset}.slot img{width:100%;height:100%;object-fit:cover;display:block}.slot input{position:absolute;width:1px;height:1px;opacity:0}.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#eee;color:#222;font-weight:bold;font-size:clamp(11px,2.5vw,19px);line-height:1.2}.has-photo .hint{display:none}.left{left:14.6%;top:28.4%;width:19.4%;height:50.6%}.right{left:62%;top:23.4%;width:25.7%;height:53.7%}button{margin:14px 4px 0;padding:14px 18px;border:0;border-radius:10px;font-size:16px;font-weight:bold}#save{background:#fff;color:#111}#clear{background:#666;color:#fff}.note{font-size:12px;color:#ccc;line-height:1.4;padding:0 15px 20px}</style></head><body><h1>Golden Hawks 20-Year Legacy</h1><p class="sub">Tap either photo square to add your own picture.</p><div class="wrap"><div class="plaque"><svg id="art" class="base" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg" aria-label="Golden Hawks 20-Year Legacy plaque"><defs><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#8b5b08"/><stop offset=".35" stop-color="#f5d46b"/><stop offset=".65" stop-color="#b77a0b"/><stop offset="1" stop-color="#f1cb55"/></linearGradient><linearGradient id="black" y1="0" y2="1"><stop stop-color="#181818"/><stop offset="1" stop-color="#030303"/></linearGradient></defs><rect width="1536" height="1024" fill="#fff"/><path d="M35 120Q35 55 130 55H590Q690 5 768 5T946 55H1406Q1501 55 1501 120V900H35Z" fill="url(#black)" stroke="#d4a52d" stroke-width="10"/><path d="M70 145Q70 90 145 90H605Q690 35 768 35T931 90H1391Q1466 90 1466 145V875H70Z" fill="none" stroke="#8d6515" stroke-width="3"/><text x="365" y="150" text-anchor="middle" fill="url(#gold)" font-size="55" font-family="Georgia,serif" font-weight="bold">WASHINGTON COUNTY</text><text x="365" y="205" text-anchor="middle" fill="#f4d36c" font-size="27" letter-spacing="12" font-family="Georgia,serif">HIGH SCHOOL</text><text x="1120" y="165" text-anchor="middle" fill="#f0c957" font-size="72" font-family="cursive" font-style="italic">Golden Legacy</text><text x="768" y="250" text-anchor="middle" fill="#f3d16a" font-size="44" font-family="Arial" font-weight="bold">GOLDEN HAWKS</text><text x="768" y="320" text-anchor="middle" fill="#fff" font-size="34" font-family="Georgia,serif">CLASS OF</text><text x="768" y="410" text-anchor="middle" fill="url(#gold)" font-size="118" font-family="Georgia,serif" font-weight="bold">2006</text><text x="768" y="540" text-anchor="middle" fill="url(#gold)" font-size="175" font-family="Georgia,serif" font-weight="bold">20</text><text x="768" y="625" text-anchor="middle" fill="#fff" font-size="90" font-family="cursive" font-style="italic">Years</text><text x="768" y="680" text-anchor="middle" fill="#f0c957" font-size="28" letter-spacing="4" font-family="Georgia,serif">AND STILL</text><text x="768" y="720" text-anchor="middle" fill="#fff" font-size="38" font-family="Georgia,serif" font-weight="bold">MAKING HISTORY</text><path d="M95 820H1441" stroke="#d4a52d" stroke-width="24"/><text x="365" y="855" text-anchor="middle" fill="#111" font-size="31" font-family="cursive" font-style="italic">Once a Golden Hawk,</text><text x="1170" y="855" text-anchor="middle" fill="#111" font-size="31" font-family="cursive" font-style="italic">Always a Golden Hawk!</text><rect x="20" y="895" width="1496" height="100" rx="20" fill="url(#black)" stroke="#d4a52d" stroke-width="7"/><text x="768" y="965" text-anchor="middle" fill="#f0c957" font-size="54" font-family="Georgia,serif" font-weight="bold">2006  —  2026</text></svg><label id="ls" class="slot left"><input id="li" type="file" accept="image/*"><img id="lp" alt=""><span class="hint">TAP TO ADD PHOTO</span></label><label id="rs" class="slot right"><input id="ri" type="file" accept="image/*"><img id="rp" alt=""><span class="hint">TAP TO ADD PHOTO</span></label></div><button id="save">Save / Download Finished Plaque</button><button id="clear">Clear Photos</button><p class="note">This version has no separate plaque image file. The artwork is built directly into the webpage, so GitHub Pages does not need to load an image asset.</p></div><script>const state={left:null,right:null},art=document.getElementById('art');function load(input,key,slot,img){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{state[key]=e.target.result;document.getElementById(img).src=e.target.result;document.getElementById(slot).classList.add('has-photo')};r.readAsDataURL(f)}li.onchange=()=>load(li,'left','ls','lp');ri.onchange=()=>load(ri,'right','rs','rp');clear.onclick=()=>{state.left=state.right=null;ls.classList.remove('has-photo');rs.classList.remove('has-photo');lp.src=rp.src='';li.value=ri.value=''};function drawPhoto(ctx,data,s){return new Promise(ok=>{if(!data)return ok();const i=new Image();i.onload=()=>{const k=Math.max(s.w/i.width,s.h/i.height),sw=s.w/k,sh=s.h/k;ctx.drawImage(i,(i.width-sw)/2,(i.height-sh)/2,sw,sh,s.x,s.y,s.w,s.h);ok()};i.src=data})}save.onclick=async()=>{const svg=new XMLSerializer().serializeToString(art),blob=new Blob([svg],{type:'image/svg+xml'}),u=URL.createObjectURL(blob),img=new Image();img.onload=async()=>{const c=document.createElement('canvas');c.width=1536;c.height=1024;const x=c.getContext('2d');x.drawImage(img,0,0);URL.revokeObjectURL(u);await drawPhoto(x,state.left,{x:224,y:291,w:298,h:518});await drawPhoto(x,state.right,{x:952,y:239,w:395,h:551});c.toBlob(async b=>{const f=new File([b],'golden-hawks-20-year-legacy.png',{type:'image/png'});try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){await navigator.share({files:[f],title:'Golden Hawks 20-Year Legacy'});return}}catch(e){}const v=URL.createObjectURL(b);window.open(v,'_blank');setTimeout(()=>URL.revokeObjectURL(v),60000)},'image/png')};img.src=u}</script></body></html>
