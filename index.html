<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golden Hawks 20-Year Legacy</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center}h1{font-size:clamp(22px,6vw,34px);margin:18px 10px 8px}.sub{margin:0 10px 14px;color:#ddd}.wrap{width:min(96vw,900px);margin:auto}.plaque{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden}.base{position:absolute;inset:0;width:100%;height:100%;display:block}.logo{position:absolute;left:42.5%;top:7%;width:15%;height:21%;object-fit:contain;pointer-events:none}.slot{position:absolute;overflow:hidden;cursor:pointer;background:#eee;border:clamp(4px,.7vw,8px) solid #c99518;box-shadow:0 0 0 2px #6d4a08 inset}.slot img{width:100%;height:100%;object-fit:cover;display:block}.slot input{position:absolute;width:1px;height:1px;opacity:0}.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#eee;color:#222;font-weight:bold;font-size:clamp(11px,2.5vw,19px);line-height:1.2}.has-photo .hint{display:none}.left{left:10.5%;top:30%;width:25%;height:53%}.right{left:64.5%;top:30%;width:25%;height:53%}button{margin:14px 4px 0;padding:14px 18px;border:0;border-radius:10px;font-size:16px;font-weight:bold}#save{background:#fff;color:#111;min-width:80%}#clear{background:#666;color:#fff}.note{font-size:12px;color:#ccc;line-height:1.4;padding:0 15px 20px}.status{min-height:20px;margin:8px 0;color:#f0c957;font-weight:bold}
</style>
</head>
<body>
<h1>Golden Hawks 20-Year Legacy</h1>
<p class="sub">Tap either photo square to add your own picture.</p>
<div class="wrap"><div class="plaque">
<svg id="art" class="base" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="gold" x1="0" x2="1"><stop stop-color="#805206"/><stop offset=".3" stop-color="#f7d96d"/><stop offset=".62" stop-color="#b77708"/><stop offset="1" stop-color="#f5d15d"/></linearGradient><linearGradient id="bg" y1="0" y2="1"><stop stop-color="#171717"/><stop offset="1" stop-color="#020202"/></linearGradient></defs>
<path d="M35 120Q35 55 130 55H590Q690 5 768 5T946 55H1406Q1501 55 1501 120V900Q1501 940 1460 940H76Q35 940 35 900Z" fill="url(#bg)" stroke="#d8aa31" stroke-width="10"/>
<path d="M70 145Q70 90 145 90H605Q690 35 768 35T931 90H1391Q1466 90 1466 145V865Q1466 905 1425 905H111Q70 905 70 865Z" fill="none" stroke="#8e6818" stroke-width="3"/>
<text x="300" y="145" text-anchor="middle" fill="url(#gold)" font-size="50" font-family="Georgia,serif" font-weight="bold">WASHINGTON COUNTY</text><text x="300" y="190" text-anchor="middle" fill="#f4d36c" font-size="25" letter-spacing="10" font-family="Georgia,serif">HIGH SCHOOL</text><text x="1230" y="155" text-anchor="middle" fill="#f0c957" font-size="62" font-family="cursive" font-style="italic">Golden Legacy</text>
<text x="768" y="285" text-anchor="middle" fill="#fff" font-size="31" font-family="Georgia,serif" font-weight="bold">CLASS OF 2006</text><text x="768" y="325" text-anchor="middle" fill="#f0c957" font-size="25" letter-spacing="5" font-family="Arial">20-YEAR LEGACY</text>
<path d="M95 855H1441" stroke="#d4a52d" stroke-width="18"/><text x="768" y="892" text-anchor="middle" fill="#f0c957" font-size="28" font-family="Georgia,serif" font-weight="bold">ONCE A GOLDEN HAWK • ALWAYS A GOLDEN HAWK</text><rect x="35" y="910" width="1466" height="40" rx="14" fill="#050505" stroke="#d4a52d" stroke-width="4"/><text x="768" y="940" text-anchor="middle" fill="#f0c957" font-size="25" font-family="Georgia,serif" font-weight="bold">2006 — 2026</text>
</svg><img id="logo" class="logo" src="logo.webp" alt="">
<label id="ls" class="slot left"><input id="li" type="file" accept="image/*"><img id="lp" alt=""><span class="hint">TAP TO ADD PHOTO</span></label><label id="rs" class="slot right"><input id="ri" type="file" accept="image/*"><img id="rp" alt=""><span class="hint">TAP TO ADD PHOTO</span></label>
</div><div id="status" class="status"></div><button id="save">Save / Download Finished Plaque</button><button id="clear">Clear Photos</button><p class="note">The finished plaque saves as a transparent PNG, so the area outside the gold frame is transparent instead of white. The Golden Hawks logo is built into the plaque.</p></div>
<script>
const state={left:null,right:null};const logo=document.getElementById('logo'),li=document.getElementById('li'),ri=document.getElementById('ri'),ls=document.getElementById('ls'),rs=document.getElementById('rs'),lp=document.getElementById('lp'),rp=document.getElementById('rp'),save=document.getElementById('save'),clear=document.getElementById('clear'),status=document.getElementById('status'),art=document.getElementById('art');
function load(input,key,slot,img){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{state[key]=e.target.result;document.getElementById(img).src=e.target.result;document.getElementById(slot).classList.add('has-photo')};r.readAsDataURL(f)}li.onchange=()=>load(li,'left','ls','lp');ri.onchange=()=>load(ri,'right','rs','rp');clear.onclick=()=>{state.left=null;state.right=null;ls.classList.remove('has-photo');rs.classList.remove('has-photo');lp.removeAttribute('src');rp.removeAttribute('src');li.value='';ri.value='';status.textContent=''};
function imageFromSvg(){return new Promise((resolve,reject)=>{const svg=new XMLSerializer().serializeToString(art);const data='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=data})}function drawPhoto(ctx,data,s){return new Promise(resolve=>{if(!data){resolve();return}const img=new Image();img.onload=()=>{const k=Math.max(s.w/img.width,s.h/img.height);const sw=s.w/k,sh=s.h/k;ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,s.x,s.y,s.w,s.h);resolve()};img.onerror=resolve;img.src=data})}
save.onclick=async()=>{save.disabled=true;status.textContent='Creating your finished plaque…';try{const img=await imageFromSvg();const c=document.createElement('canvas');c.width=1536;c.height=1024;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,1536,1024);const logoImg=await new Promise((resolve,reject)=>{const z=new Image();z.onload=()=>resolve(z);z.onerror=reject;z.src=logo.src});ctx.drawImage(logoImg,653,70,230,214);await drawPhoto(ctx,state.left,{x:161,y:307,w:384,h:542});await drawPhoto(ctx,state.right,{x:992,y:307,w:384,h:542});c.toBlob(blob=>{if(!blob){status.textContent='Could not create the image. Please try again.';save.disabled=false;return}const url=URL.createObjectURL(blob);status.textContent='Finished PNG ready — opening it now.';window.location.href=url;setTimeout(()=>URL.revokeObjectURL(url),120000);save.disabled=false},'image/png')}catch(e){status.textContent='Could not create the image. Please try again.';save.disabled=false}};
</script></body></html>
