<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden Hawks 20-Year Legacy</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial;text-align:center}h1{font-size:28px;margin:24px 12px 6px}.sub{margin:0 12px 16px;color:#ddd}.wrap{width:min(96vw,900px);margin:auto}.plaque{position:relative;width:100%;line-height:0}.base{display:block;width:100%;height:auto}.slot{position:absolute;overflow:hidden;background:#aaa;cursor:pointer}.left{left:14.58%;top:28.22%;width:19.4%;height:50.68%}.right{left:61.91%;top:23.14%;width:25.85%;height:53.91%}.slot img{width:100%;height:100%;object-fit:cover}.slot input{display:none}.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#222;font-weight:bold;font-size:16px;line-height:1.2}.has .hint{display:none}button{margin:18px 5px;padding:14px 18px;border:0;border-radius:10px;font-weight:bold;font-size:16px}#clear{background:#666;color:#fff}.note{color:#ccc;font-size:13px;line-height:1.45;margin:8px 18px 30px}</style></head><body><h1>Golden Hawks 20-Year Legacy</h1><p class="sub">Tap either photo square to add your own picture.</p><div class="wrap"><div class="plaque"><img class="base" src="https://cdn.jsdelivr.net/gh/cckitchens6-eng/golden-hawks-photo-customizer-@main/golden-hawks-20-year-legacy.jpg?v=5" alt="Golden Hawks 20-Year Legacy plaque"><label class="slot left" id="ls"><input type="file" accept="image/*"><img id="lp"><span class="hint">TAP TO ADD<br>PHOTO</span></label><label class="slot right" id="rs"><input type="file" accept="image/*"><img id="rp"><span class="hint">TAP TO ADD<br>PHOTO</span></label></div><button id="save">Save / Download Finished Plaque</button><button id="clear">Clear Photos</button><p class="note">Your photos stay on your device while you edit.</p></div><script>const state={l:null,r:null};function setup(slot,img,key){const input=slot.querySelector('input');input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{state[key]=e.target.result;img.src=e.target.result;slot.classList.add('has')};r.readAsDataURL(f)}}setup(ls,lp,'l');setup(rs,rp,'r');clear.onclick=()=>{state.l=state.r=null;ls.classList.remove('has');rs.classList.remove('has');lp.src=rp.src='';ls.querySelector('input').value=rs.querySelector('input').value=''};save.onclick=async()=>{const b=document.querySelector('.base');if(!b.naturalWidth)return alert('Please wait for the plaque to load.');const c=document.createElement('canvas');c.width=1536;c.height=1024;const x=c.getContext('2d');x.drawImage(b,0,0,1536,1024);for(const [d,s] of [[state.l,{x:224,y:289,w:298,h:519}],[state.r,{x:951,y:237,w:397,h:552}]])if(d){await new Promise(ok=>{const i=new Image;i.onload=()=>{const k=Math.max(s.w/i.width,s.h/i.height),sw=s.w/k,sh=s.h/k;x.drawImage(i,(i.width-sw)/2,(i.height-sh)/2,sw,sh,s.x,s.y,s.w,s.h);ok()};i.src=d})}c.toBlob(async blob=>{const f=new File([blob],'golden-hawks-20-year-legacy.png',{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]})))try{return await navigator.share({files:[f],title:'Golden Hawks 20-Year Legacy'})}catch(e){}const u=URL.createObjectURL(blob);location.href=u},'image/png')}</script></body></html>
