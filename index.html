<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Golden Hawks 20-Year Legacy — Photo Editor</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}header{width:100%;max-width:1000px;text-align:center;padding:18px 14px 8px}h1{font-size:clamp(21px,5vw,32px);margin:0 0 8px}.sub{margin:0;font-size:15px}.wrap{width:min(96vw,900px);padding:10px 0 28px}.plaque{position:relative;width:100%;overflow:hidden}.base{display:block;width:100%;height:auto}.photo-slot{position:absolute;overflow:hidden;cursor:pointer;background:#aaa}.photo-slot img{display:block;width:100%;height:100%;object-fit:cover}.slot-left{left:14.58%;top:28.22%;width:19.40%;height:50.68%}.slot-right{left:61.91%;top:23.14%;width:25.85%;height:53.91%}.photo-slot input{position:absolute;width:1px;height:1px;opacity:0}.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#aaa;color:#222;font-weight:700;font-size:clamp(11px,2.4vw,18px);line-height:1.2;padding:8px}.has-photo .hint{display:none}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:700}#save{background:#fff;color:#111}#clear{background:#666;color:#fff}.note{text-align:center;color:#ccc;font-size:12px;line-height:1.45;margin:12px auto;max-width:700px}</style></head><body><header><h1>Golden Hawks 20-Year Legacy</h1><p class="sub">Tap either photo square to add your own picture.</p></header><div class="wrap"><div class="plaque"><img id="base" class="base" src="https://raw.githubusercontent.com/cckitchens6-eng/golden-hawks-photo-customizer-/main/golden-hawks-20-year-legacy.jpg?ver=20260906-2" alt="Golden Hawks 20-Year Legacy plaque"><label class="photo-slot slot-left" id="leftSlot"><input id="leftInput" type="file" accept="image/*"><img id="leftPhoto" alt=""><span class="hint">TAP TO ADD PHOTO</span></label><label class="photo-slot slot-right" id="rightSlot"><input id="rightInput" type="file" accept="image/*"><img id="rightPhoto" alt=""><span class="hint">TAP TO ADD PHOTO</span></label></div><div class="controls"><button id="save">Save / Download Finished Plaque</button><button id="clear">Clear Photos</button></div><p class="note">Your photos stay on your device while you edit. On iPhone or Samsung, Save opens the phone's share/save options.</p></div><script>const state={left:null,right:null};const base=document.getElementById('base');base.onerror=()=>{base.src='https://cdn.jsdelivr.net/gh/cckitchens6-eng/golden-hawks-photo-customizer-@main/golden-hawks-20-year-legacy.jpg?ver=20260906-2'};function load(input,key,slot,img){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{state[key]=e.target.result;document.getElementById(img).src=e.target.result;document.getElementById(slot).classList.add('has-photo')};r.readAsDataURL(f)}leftInput.addEventListener('change',()=>load(leftInput,'left','leftSlot','leftPhoto'));rightInput.addEventListener('change',()=>load(rightInput,'right','rightSlot','rightPhoto'));clear.addEventListener('click',()=>{state.left=state.right=null;leftSlot.classList.remove('has-photo');rightSlot.classList.remove('has-photo');leftPhoto.src=rightPhoto.src='';leftInput.value=rightInput.value=''});function cover(ctx,data,s){return new Promise(ok=>{if(!data)return ok();const i=new Image();i.onload=()=>{const k=Math.max(s.w/i.width,s.h/i.height),sw=s.w/k,sh=s.h/k;ctx.drawImage(i,(i.width-sw)/2,(i.height-sh)/2,sw,sh,s.x,s.y,s.w,s.h);ok()};i.src=data})}save.addEventListener('click',async()=>{if(!base.complete||!base.naturalWidth){alert('The plaque is still loading. Please wait a moment and try again.');return}const c=document.createElement('canvas');c.width=1536;c.height=1024;const x=c.getContext('2d');x.drawImage(base,0,0,1536,1024);await cover(x,state.left,{x:224,y:289,w:298,h:519});await cover(x,state.right,{x:951,y:237,w:397,h:552});c.toBlob(async b=>{if(!b)return;const file=new File([b],'golden-hawks-20-year-legacy.png',{type:'image/png'});try{if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({files:[file],title:'Golden Hawks 20-Year Legacy'});return}}catch(e){if(e.name==='AbortError')return}const u=URL.createObjectURL(b),w=window.open(u,'_blank');if(!w){const a=document.createElement('a');a.href=u;a.download=file.name;a.click()}setTimeout(()=>URL.revokeObjectURL(u),60000)},'image/png')});</script></body></html>
